# One structural library for all 21 instances.
# Publishes to ../data/structural_library/baseline.

schema_version = 1

[experiment]
id = "sl_21_L6750_B2"
workflow = "structural_library"
slab_type = "hp_slab"
problem_ids = ["L6750_B2"]
output_root = "../../data"

[structural_library]
rows_per_shard = 4096
acknowledge_large_run = true
maximum_expected_ids = 3000000
maximum_expected_bytes = 20000000000
compatible_problem_ids = [
  "L6750_A1",
  "L6750_B1",
  "L6750_B2",
  "L7425_A1",
  "L7425_B1",
  "L7425_B2",
  "L8100_A1",
  "L8100_B1",
  "L8100_B2",
  "L8775_A1",
  "L8775_B1",
  "L8775_B2",
  "L9450_A1",
  "L9450_B1",
  "L9450_B2",
  "L10125_A1",
  "L10125_B1",
  "L10125_B2",
  "L10800_A1",
  "L10800_B1",
  "L10800_B2"
]

[execution]
backend = "local"
max_parallel_tasks = 4
timeout_seconds = 7200
cpus_per_task = 1

[execution.thread_environment]
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"

[execution.local]
python_executable = ""
