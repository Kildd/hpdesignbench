# Penalty or constraint-aware optimisation. output_root is relative to this file.
# Run from any directory:
#   hdb-experiment run --config configs/release/optimization_constrained_validation.toml

schema_version = 1

[experiment]
id = "constrained_validation"
workflow = "optimization_runs"
slab_type = "hp_slab"
problem_ids = ["L6750_A1", "L6750_B1", "L7425_A1", "L7425_B1", "L7425_B2", "L8100_A1", "L8100_B1", "L8775_A1", "L8775_B1", "L8775_B2", "L9450_A1", "L9450_B1", "L10125_A1", "L10125_B1", "L10125_B2", "L10800_A1", "L10800_B1"]
output_root = "../../data"

